name: v2-ci

on:
  pull_request:
  push:
    branches:
      - rebuild/v2

permissions:
  contents: read

jobs:
  v2-python310:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install v2 package
        run: python -m pip install --no-deps -e .
      - name: Compile v2
        run: python -m compileall -q src tests_v2
      - name: Test v2
        run: python -m unittest discover -s tests_v2 -t . -v

  control-plane-node22:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      ADMIN_KEY_HASH: scrypt$16384$8$1$AAAAAAAAAAAAAAAAAAAAAA$AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      SESSION_SECRET: test-session-secret-that-is-at-least-sixty-four-characters-long-0001
      APP_ORIGIN: https://example.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
