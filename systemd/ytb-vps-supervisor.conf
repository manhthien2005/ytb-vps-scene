[program:ytb-vps]
command=/opt/ytb-vps/.venv/bin/ytb-vps --config /etc/ytb-vps/config.yaml worker
directory=/srv/ytb-vps
user=root
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1",CODEX_HOME="/root/.config/ytb-vps/secrets/codex"
stdout_logfile=/srv/ytb-vps/logs/supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
